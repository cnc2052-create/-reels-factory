<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>폼폼 PomPom 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#0f0f14;color:#e0e0e0;min-height:100vh}
header{background:linear-gradient(135deg,#ff6b9d,#a855f7);padding:18px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(255,107,157,.3)}
header h1{font-size:1.5rem;font-weight:700;color:#fff}
header span{font-size:.85rem;color:rgba(255,255,255,.8);margin-left:auto}
.container{max-width:1100px;margin:0 auto;padding:24px 16px}
.tabs{display:flex;gap:8px;margin-bottom:24px;border-bottom:1px solid #2a2a3a;padding-bottom:0}
.tab{padding:10px 20px;cursor:pointer;border-bottom:3px solid transparent;color:#888;font-weight:600;transition:.2s}
.tab.active{color:#ff6b9d;border-color:#ff6b9d}
.panel{display:none}
.panel.active{display:block}
.card{background:#1a1a24;border-radius:14px;padding:20px;margin-bottom:16px;border:1px solid #2a2a3a}
.card h3{font-size:1rem;font-weight:700;margin-bottom:14px;color:#ff6b9d}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
label{display:block;font-size:.8rem;color:#888;margin-bottom:4px}
select,input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #333;background:#0f0f14;color:#e0e0e0;font-size:.9rem;font-family:inherit}
select:focus,input:focus{outline:none;border-color:#ff6b9d}
.btn{padding:11px 24px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:.9rem;font-family:inherit;transition:.2s}
.btn-primary{background:linear-gradient(135deg,#ff6b9d,#a855f7);color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-secondary{background:#2a2a3a;color:#ccc}
.upload-zone{border:2px dashed #444;border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:.2s}
.upload-zone:hover,.upload-zone.drag{border-color:#ff6b9d;background:rgba(255,107,157,.05)}
.upload-zone img{max-height:180px;max-width:100%;border-radius:8px;margin-top:12px}
.upload-icon{font-size:2.5rem;margin-bottom:8px}
.job-list{display:grid;gap:10px}
.job-card{background:#12121c;border-radius:10px;padding:14px 16px;border-left:4px solid #333;display:flex;align-items:center;gap:14px}
.job-card.done{border-color:#22c55e}
.job-card.running{border-color:#f59e0b}
.job-card.error{border-color:#ef4444}
.job-badge{font-size:.7rem;padding:3px 8px;border-radius:20px;font-weight:700}
.badge-done{background:#14532d;color:#86efac}
.badge-running{background:#451a03;color:#fcd34d}
.badge-error{background:#450a0a;color:#fca5a5}
.notion-grid{display:grid;gap:8px}
.notion-row{background:#12121c;border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;font-size:.85rem}
.notion-row .name{font-weight:600;color:#e0e0e0}
.notion-row .meta{color:#666;font-size:.78rem}
.status-chip{font-size:.7rem;padding:2px 8px;border-radius:10px;background:#1e3a5f;color:#7dd3fc}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #444;border-top-color:#ff6b9d;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a24;border:1px solid #ff6b9d;border-radius:10px;padding:12px 18px;font-size:.9rem;z-index:999;animation:fadeIn .3s ease;max-width:300px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.progress-bar{height:4px;background:#2a2a3a;border-radius:2px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,#ff6b9d,#a855f7);border-radius:2px;transition:width .5s}
.empty{text-align:center;color:#444;padding:32px;font-size:.9rem}
</style>
</head>
<body>
<header>
  <div>🎀</div>
  <h1>폼폼 PomPom</h1>
  <span id="clock"></span>
</header>

<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('auto')">🤖 AI 자동 생성</div>
    <div class="tab" onclick="switchTab('manual')">📸 수동 업로드</div>
    <div class="tab" onclick="switchTab('history')">📋 생성 기록</div>
    <div class="tab" onclick="switchTab('notion')">📊 노션 DB</div>
  </div>

  <!-- AI 자동 생성 -->
  <div class="panel active" id="panel-auto">
    <div class="card">
      <h3>🤖 AI 자동 기획 + 영상 생성</h3>
      <p style="font-size:.85rem;color:#666;margin-bottom:16px">AI가 트렌드 제품을 찾아 스크립트 생성 → 영상 제작 → 노션 저장까지 자동으로 처리합니다.</p>
      <div class="form-row">
        <div>
          <label>카테고리</label>
          <select id="auto-niche">
            <option value="beauty">💄 뷰티</option>
            <option value="health_fitness">💪 건강/피트니스</option>
            <option value="home_living">🏠 홈리빙</option>
            <option value="fashion">👗 패션</option>
            <option value="food">🍜 푸드</option>
          </select>
        </div>
        <div>
          <label>계정 (페르소나)</label>
          <select id="auto-persona">
            <option value="pompom_beauty">💄 뷰티폼 (인스타)</option>
            <option value="pompom_health">💪 헬스폼</option>
            <option value="pompom_home">🏠 홈폼</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" onclick="startAutoGenerate()">▶ 자동 생성 시작</button>
    </div>
    <div id="auto-jobs" class="job-list"></div>
  </div>

  <!-- 수동 업로드 -->
  <div class="panel" id="panel-manual">
    <div class="card">
      <h3>📸 사진으로 영상 만들기</h3>
      <p style="font-size:.85rem;color:#666;margin-bottom:16px">상품 사진 1장을 올리면 AI가 스크립트를 쓰고 영상으로 만들어줍니다.</p>

      <div class="upload-zone" id="upload-zone" onclick="document.getElementById('img-input').click()"
           ondragover="event.preventDefault();this.classList.add('drag')"
           ondragleave="this.classList.remove('drag')"
           ondrop="handleDrop(event)">
        <div class="upload-icon">📷</div>
        <div style="font-weight:600">사진을 끌어다 놓거나 클릭해서 선택</div>
        <div style="font-size:.8rem;color:#666;margin-top:4px">JPG, PNG, WEBP 지원</div>
        <img id="preview-img" style="display:none">
      </div>
      <input type="file" id="img-input" accept="image/*" style="display:none" onchange="previewImage(this)">

      <div class="form-row" style="margin-top:14px">
        <div>
          <label>제품명</label>
          <input type="text" id="m-product" placeholder="예: 메디힐 마스크팩">
        </div>
        <div>
          <label>가격 (원)</label>
          <input type="number" id="m-price" placeholder="예: 15900">
        </div>
      </div>
      <div style="margin-bottom:12px">
        <label>제품 설명 / 바이럴 포인트</label>
        <input type="text" id="m-desc" placeholder="예: 수분 촉촉 마스크팩 최저가">
      </div>
      <div style="margin-bottom:16px">
        <label>카테고리</label>
        <select id="m-niche">
          <option value="beauty">💄 뷰티</option>
          <option value="health_fitness">💪 건강</option>
          <option value="home_living">🏠 홈리빙</option>
          <option value="fashion">👗 패션</option>
          <option value="food">🍜 푸드</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="startManual()">📸 영상 생성하기</button>
    </div>
    <div id="manual-jobs" class="job-list"></div>
  </div>

  <!-- 생성 기록 -->
  <div class="panel" id="panel-history">
    <div class="card">
      <h3>📋 이번 세션 생성 기록</h3>
      <div id="history-list" class="job-list">
        <div class="empty">아직 생성한 영상이 없습니다</div>
      </div>
    </div>
  </div>

  <!-- 노션 DB -->
  <div class="panel" id="panel-notion">
    <div class="card">
      <h3>📊 노션 콘텐츠 DB</h3>
      <button class="btn btn-secondary" onclick="loadNotion()" style="margin-bottom:14px;font-size:.82rem;padding:7px 14px">↻ 새로고침</button>
      <div id="notion-list" class="notion-grid">
        <div class="empty">로딩 중...</div>
      </div>
    </div>
  </div>
</div>

<script>
// 시계
setInterval(()=>{
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleDateString('ko-KR') + ' ' +
    now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
},1000);

function switchTab(id){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const ids=['auto','manual','history','notion'];
    t.classList.toggle('active', ids[i]===id);
  });
  document.querySelectorAll('.panel').forEach(p=>{
    p.classList.toggle('active', p.id==='panel-'+id);
  });
  if(id==='notion') loadNotion();
  if(id==='history') renderAllJobs();
}

// ── 이미지 미리보기
function previewImage(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = document.getElementById('preview-img');
    img.src = e.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
}
function handleDrop(e){
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if(!file) return;
  const dt = new DataTransfer();
  dt.items.add(file);
  document.getElementById('img-input').files = dt.files;
  previewImage({files:[file]});
}

// ── AI 자동 생성
async function startAutoGenerate(){
  const niche = document.getElementById('auto-niche').value;
  const persona = document.getElementById('auto-persona').value;
  showToast('AI 자동 생성 시작...');
  const res = await fetch('/api/generate',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({niche, persona})
  });
  const data = await res.json();
  if(data.job_id) pollJob(data.job_id, 'auto-jobs');
}

// ── 수동 생성
async function startManual(){
  const file = document.getElementById('img-input').files[0];
  if(!file){showToast('사진을 먼저 선택해주세요!','error');return;}
  const product = document.getElementById('m-product').value.trim();
  if(!product){showToast('제품명을 입력해주세요!','error');return;}

  const fd = new FormData();
  fd.append('image', file);
  fd.append('product_name', product);
  fd.append('price', document.getElementById('m-price').value || '0');
  fd.append('description', document.getElementById('m-desc').value);
  fd.append('niche', document.getElementById('m-niche').value);

  showToast('영상 생성 중...');
  const res = await fetch('/api/manual',{method:'POST',body:fd});
  const data = await res.json();
  if(data.job_id) pollJob(data.job_id, 'manual-jobs');
}

// ── 작업 폴링
const allJobs = {};
function pollJob(jobId, containerId){
  allJobs[jobId] = {id:jobId, status:'running', type:'unknown'};
  renderJob(jobId, containerId);

  const timer = setInterval(async()=>{
    const r = await fetch('/api/job/'+jobId);
    const d = await r.json();
    allJobs[jobId] = d;
    renderJob(jobId, containerId);
    if(d.status==='done'){
      clearInterval(timer);
      showToast('✅ 영상 생성 완료! ' + (d.product||''));
    } else if(d.status==='error'){
      clearInterval(timer);
      showToast('❌ 오류: ' + d.error, 'error');
    }
  }, 3000);
}

function renderJob(jobId, containerId){
  const job = allJobs[jobId];
  const el = document.getElementById('job-'+jobId) || document.createElement('div');
  el.id = 'job-'+jobId;
  el.className = 'job-card ' + (job.status||'');
  const badgeClass = job.status==='done'?'badge-done':job.status==='error'?'badge-error':'badge-running';
  const badgeText = job.status==='done'?'완료':job.status==='error'?'오류':'처리중';
  el.innerHTML = `
    <div>
      <span class="job-badge ${badgeClass}">${badgeText}</span>
    </div>
    <div style="flex:1">
      <div style="font-weight:600;font-size:.9rem">${job.product||'생성 중...'}</div>
      <div style="font-size:.78rem;color:#555;margin-top:3px">${job.hook||''}</div>
      ${job.status==='running'?'<div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>':''}
    </div>
    <div style="font-size:.75rem;color:#444">${job.id}</div>
  `;
  const container = document.getElementById(containerId);
  if(!document.getElementById('job-'+jobId)) container.appendChild(el);
}

function renderAllJobs(){
  const list = document.getElementById('history-list');
  const jobs = Object.values(allJobs);
  if(!jobs.length){list.innerHTML='<div class="empty">아직 생성한 영상이 없습니다</div>';return;}
  list.innerHTML = '';
  jobs.forEach(job=>{
    const el = document.createElement('div');
    el.className = 'job-card '+(job.status||'');
    const badgeClass = job.status==='done'?'badge-done':job.status==='error'?'badge-error':'badge-running';
    el.innerHTML = `
      <span class="job-badge ${badgeClass}">${job.status==='done'?'완료':job.status==='error'?'오류':'처리중'}</span>
      <div style="flex:1">
        <div style="font-weight:600">${job.product||job.type||'-'}</div>
        <div style="font-size:.78rem;color:#555">${job.caption?.slice(0,60)||''}</div>
      </div>
    `;
    list.appendChild(el);
  });
}

// ── 노션 DB
async function loadNotion(){
  document.getElementById('notion-list').innerHTML = '<div class="empty"><span class="spinner"></span> 로딩 중...</div>';
  const r = await fetch('/api/notion');
  const items = await r.json();
  if(!items.length||items.error){
    document.getElementById('notion-list').innerHTML='<div class="empty">데이터 없음</div>';
    return;
  }
  document.getElementById('notion-list').innerHTML = items.map(item=>`
    <div class="notion-row">
      <span class="status-chip">${item.status||'-'}</span>
      <div>
        <div class="name">${item.product||item.name||'-'}</div>
        <div class="meta">${item.hook||''} · ${item.platform||''}</div>
      </div>
      <div style="font-size:.75rem;color:#444">${(item.created||'').slice(0,10)}</div>
      <div></div>
    </div>
  `).join('');
}

// ── 토스트
function showToast(msg, type='info'){
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.borderColor = type==='error'?'#ef4444':'#ff6b9d';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}

// 초기 로드
loadNotion();
</script>
</body>
</html>
